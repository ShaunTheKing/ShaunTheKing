<svg xmlns="http://www.w3.org/2000/svg" width="840" height="110" viewBox="0 0 840 110">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>
<rect width="840" height="110" rx="24" fill="#000000"/>
<text x="420.0" y="58" font-size="40" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.02em" class="fade d1">Featured work.</text>
<text x="420.0" y="92" font-size="17" font-weight="400" fill="#86868b" text-anchor="middle" letter-spacing="-0.02em" class="fade d2">Agents, models, and data — from research lab to production.</text>
</svg>

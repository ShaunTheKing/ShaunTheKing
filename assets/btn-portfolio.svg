<svg xmlns="http://www.w3.org/2000/svg" width="116" height="40" viewBox="0 0 116 40">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.24"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#8b0000" stop-opacity="0.30"/><stop offset="1" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
<rect width="116" height="40" rx="20" fill="#d70015"/>
<text x="58.0" y="25.5" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Portfolio</text>
</svg>

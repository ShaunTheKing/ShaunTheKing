<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>

<rect width="840" height="400" rx="28" fill="#000000"/>
<text x="420.0" y="112" font-size="21" font-weight="600" fill="#86868b" text-anchor="middle" letter-spacing="-0.02em" class="fade d1">Shaun Salvador Andrade</text>
<text x="420.0" y="186" font-size="60" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.02em" class="fade d2">Software that thinks.</text>
<text x="420.0" y="256" font-size="60" font-weight="700" fill="url(#g)" text-anchor="middle" letter-spacing="-0.02em" class="fade d3">Built to ship.</text>
<text x="420.0" y="314" font-size="17" font-weight="500" fill="#a1a1a6" text-anchor="middle" letter-spacing="-0.02em" class="fade d4">CS @ UMBC  ·  Multi-agent systems  ·  Model fine-tuning  ·  ViT research</text>

</svg>

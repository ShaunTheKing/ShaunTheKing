<svg xmlns="http://www.w3.org/2000/svg" width="412" height="300" viewBox="0 0 412 300">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#0058d0"/>
    </linearGradient>
  </defs>
<rect width="412" height="300" rx="28" fill="#1d1d1f"/>
<text x="32" y="50" font-size="13" font-weight="600" fill="#86868b" text-anchor="start" letter-spacing="-0.02em">Research · UMBC</text>
<text x="32" y="92" font-size="30" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.02em">BehaviorScope‑X.</text>
<text x="32" y="128" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="-0.02em">Trained a Vision Transformer to classify</text>
<text x="32" y="150" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="-0.02em">mouse behavior from video. 82.7% macro</text>
<text x="32" y="172" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="-0.02em">accuracy · bioRxiv preprint (2026).</text>

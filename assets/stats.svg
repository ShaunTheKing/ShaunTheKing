<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>
<rect width="840" height="150" rx="28" fill="#1d1d1f"/>
<text x="105.0" y="78" font-size="42" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.02em" class="fade d1">250+</text>
<text x="105.0" y="108" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="-0.02em" class="fade d1">model downloads</text>
<text x="315.0" y="78" font-size="42" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.02em" class="fade d2">115k+</text>
<text x="315.0" y="108" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="-0.02em" class="fade d2">loans · SQL risk modeling</text>
<rect x="210" y="40" width="1" height="70" fill="#38383a"/>
<text x="525.0" y="78" font-size="42" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.02em" class="fade d3">625+</text>
<text x="525.0" y="108" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="-0.02em" class="fade d3">tests written</text>
<rect x="420" y="40" width="1" height="70" fill="#38383a"/>
<text x="735.0" y="78" font-size="42" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.02em" class="fade d4">3.8</text>
<text x="735.0" y="108" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="-0.02em" class="fade d4">GPA at UMBC</text>
